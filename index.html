<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elle's Thesis Journal</title>
<meta name="description" content="Progress log for my thesis project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page journal">

  <!-- Sidebar: title, search, tags, and the list of entries -->
  <aside class="side">
    <!-- Edit your title and subtitle here -->
    <header class="site-head">
      <h1>Elle's Thesis Journal</h1>
      <p>Logging my progress on this page.</p>
    </header>
    <div class="finder">
      <input id="search" type="search" placeholder="Search" aria-label="Search entries">
      <div id="tags"></div>
    </div>
    <nav id="toc" aria-label="Entries"></nav>
  </aside>

  <main id="feed"></main>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
// Reads entries.js whether it says "const ENTRIES = [...]" or "window.ENTRIES = [...]".
function readEntriesGlobal() {
  return (typeof ENTRIES !== "undefined") ? ENTRIES : window.ENTRIES;
}

(function () {
  "use strict";

  var ENTRIES = [];
  var $ = function (id) { return document.getElementById(id); };
  var feed = $("feed"), tagsEl = $("tags"), search = $("search"), toc = $("toc");
  var activeTag = null;
  var SHOW_MONTHS = false;   // set to true to bring back the "October 2026" headings

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toDate(iso) {
    var s = String(iso || "");
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s += "T00:00:00";
    var d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function niceDate(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { weekday: "short", month: "long", day: "numeric", year: "numeric" }) : (iso || "Undated");
  }
  function month(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "Undated";
  }

  /* ---------- small markdown ---------- */
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split("\n");
    var out = [], para = [], list = null, code = null, m;
    function endPara() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    function endList() { if (list) { out.push("</" + list + ">"); list = null; } }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (code) {
        if (line.indexOf("```") === 0) { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; }
        else code.push(raw);
        return;
      }
      if (line.indexOf("```") === 0) { endPara(); endList(); code = []; return; }
      if (!line) { endPara(); endList(); return; }
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { endPara(); endList(); var h = Math.min(m[1].length + 2, 6); out.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">"); return; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { endPara(); endList(); out.push("<hr>"); return; }
      if ((m = line.match(/^[-*+]\s+(.*)$/)) || (m = line.match(/^\d+[.)]\s+(.*)$/))) {
        var type = /^\d/.test(line) ? "ol" : "ul";
        endPara();
        if (list !== type) { endList(); out.push("<" + type + ">"); list = type; }
        out.push("<li>" + inline(m[1]) + "</li>");
        return;
      }
      if ((m = line.match(/^&gt;\s?(.*)$/))) { endPara(); endList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); return; }
      para.push(line);
    });
    if (code) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
    endPara(); endList();
    return out.join("\n");
  }

  /* ---------- feed ---------- */
  // Photos keep their own shape: one photo is shown full width, several sit in two columns.
  // Videos always get the full width, after the photos.
  function mediaHTML(items, extra) {
    var isVid = function (im) { return /\.(mp4|m4v|mov|webm|ogv)$/i.test(im.src); };
    var cap = function (im) { return im.caption ? "<figcaption>" + esc(im.caption) + "</figcaption>" : ""; };
    var photos = items.filter(function (im) { return !isVid(im); });
    var videos = items.filter(isVid);
    return (photos.length ? '<div class="pics' + (extra ? " " + extra : "") + (photos.length === 1 ? " one" : "") + '">' + photos.map(function (im) {
        return '<figure><img src="' + esc(im.src) + '" alt="' + esc(im.caption || "") + '" loading="lazy">' + cap(im) + "</figure>";
      }).join("") + "</div>" : "") +
      (videos.length ? '<div class="vids">' + videos.map(function (im) {
        return '<figure><video src="' + esc(im.src) + '#t=0.1" controls playsinline preload="metadata"></video>' + cap(im) + "</figure>";
      }).join("") + "</div>" : "");
  }

  /* ---------- photo groups ----------
     An entry's photos can be split into groups, each with its own layout
     (set in admin.html). Older entries without groups show as one "auto" group.
       auto     photos packed into even rows (the original look)
       grid     equal columns (2, 3 or 4), photos keep their shape
       feature  first photo big, the rest small beside it
       phones   tall phone screens side by side at one height
       full     one photo per row, full width
       compare  two side by side, with captions                       */
  var LAYOUTS = ["auto", "grid", "feature", "phones", "full", "compare"];
  // Grid cell shapes. "auto" = the most common shape among the group's photos; "none" = no cropping.
  var SHAPES = ["auto", "1/1", "4/3", "16/9", "3/4", "none"];
  function normImages(list) {
    return (list || []).map(function (im) { return typeof im === "string" ? { src: im } : (im || {}); })
      .filter(function (im) { return im.src; });
  }
  function entryGroups(e) {
    var gs = Array.isArray(e.groups) && e.groups.length ? e.groups : [{ layout: "auto", images: e.images }];
    return gs.map(function (g) {
      return { layout: LAYOUTS.indexOf(g.layout) === -1 ? "auto" : g.layout,
               cols: Math.min(6, Math.max(2, +g.cols || 3)),
               shape: SHAPES.indexOf(g.shape) === -1 ? "auto" : g.shape,
               caption: g.caption || "", images: normImages(g.images) };
    }).filter(function (g) { return g.images.length; });
  }
  function isVideo(im) { return /\.(mp4|m4v|mov|webm|ogv)$/i.test(im.src); }
  function figHTML(im) {
    var cap = im.caption ? "<figcaption>" + esc(im.caption) + "</figcaption>" : "";
    return isVideo(im)
      ? '<figure><video src="' + esc(im.src) + '#t=0.1" controls playsinline preload="metadata"></video>' + cap + "</figure>"
      : '<figure><img src="' + esc(im.src) + '" alt="' + esc(im.caption || "") + '" loading="lazy">' + cap + "</figure>";
  }
  function groupHTML(g) {
    var inner, figs = function (list) { return list.map(figHTML).join(""); };
    if (g.layout === "auto" || g.layout === "phones") {
      inner = mediaHTML(g.images, g.layout === "phones" ? "phones" : "");
    } else if (g.layout === "grid") {
      inner = '<div class="grid" data-shape="' + g.shape + '" style="--cols:' + g.cols +
        (g.shape !== "auto" && g.shape !== "none" ? "; --cell-ratio:" + g.shape : "") + '">' + figs(g.images) + "</div>";
    } else if (g.layout === "feature") {
      inner = '<div class="feature' + (g.images.length === 1 ? " one" : "") + '">' +
        '<div class="hero">' + figHTML(g.images[0]) + "</div>" +
        (g.images.length > 1 ? '<div class="rest">' + figs(g.images.slice(1)) + "</div>" : "") + "</div>";
    } else if (g.layout === "full") {
      inner = '<div class="full">' + figs(g.images) + "</div>";
    } else {
      inner = '<div class="compare">' + figs(g.images) + "</div>";
    }
    return '<div class="group g-' + g.layout + '">' +
      (g.caption ? '<div class="group-cap">' + esc(g.caption) + "</div>" : "") + inner + "</div>";
  }

  // An "auto" grid crops every photo to the shape most of its photos already have,
  // so the cells line up while cropping as little as possible. (Clicking still shows the full photo.)
  function shapeGrid(box) {
    var rs = [];
    box.querySelectorAll("img").forEach(function (img) {
      if (img.naturalWidth) rs.push(Math.round(img.naturalWidth / img.naturalHeight * 20) / 20);
    });
    if (!rs.length) return;
    var count = {}, best = rs[0];
    rs.forEach(function (r) { count[r] = (count[r] || 0) + 1; if (count[r] > count[best]) best = r; });
    box.style.setProperty("--cell-ratio", best);
  }

  /* ---------- photo rows ----------
     Packs photos into rows that fill the column width without cropping.
     Each row gets one height; photos keep their own shape within it. */
  function cssPx(el, name, fallback) {
    var v = parseFloat(getComputedStyle(el).getPropertyValue(name));
    return isNaN(v) ? fallback : v;
  }
  function layoutPics(box) {
    var W = box.clientWidth;
    if (!W) return;
    var target = cssPx(box, "--photo-height", 220);
    var maxH   = cssPx(box, "--photo-max-height", 280);
    var single = cssPx(box, "--single-photo-height", 320);
    var gap    = parseFloat(getComputedStyle(box).columnGap) || 8;
    // A small set of photos (2–4) gets bigger rows, so it doesn't look lost.
    var few = box.children.length <= 4;
    if (few) { target = Math.max(target, 200); maxH = Math.max(maxH, 300); }
    var figs = Array.prototype.slice.call(box.children);
    var shapes = figs.map(function (f) {
      var img = f.querySelector("img");
      return img && img.naturalWidth ? img.naturalWidth / img.naturalHeight : 4 / 3;  // guess until loaded
    });
    function size(f, r, h) { f.style.width = Math.floor(r * h) + "px"; }

    if (figs.length === 1) {   // a lone photo: as wide as fits, but no taller than the single limit
      size(figs[0], shapes[0], Math.min(single, W / shapes[0]));
      return;
    }
    var row = [], sum = 0, lastH = null;
    function rowHeight(n, s) { return (W - gap * (n - 1)) / s - 0.5; }
    function closeRow(h) { row.forEach(function (i) { size(figs[i], shapes[i], h); }); row = []; sum = 0; lastH = h; }
    shapes.forEach(function (r, i) {
      if (row.length) {
        var hNow  = rowHeight(row.length, sum);          // finish the row here
        var hNext = rowHeight(row.length + 1, sum + r);  // or squeeze this photo in too
        if (hNow <= maxH && Math.abs(hNow - target) < Math.abs(hNext - target)) closeRow(hNow);
      }
      row.push(i); sum += r;
    });
    // The last row isn't stretched to fill the width: it matches the row above (or the target height).
    if (row.length) closeRow(Math.min(lastH || (few ? maxH : target), rowHeight(row.length, sum)));
  }
  var relayoutTimer;
  window.addEventListener("resize", function () {
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(function () { feed.querySelectorAll(".pics").forEach(layoutPics); pinText(); }, 100);
  });

  function keepLastWordsTogether(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), node, last = null;
    while ((node = walker.nextNode())) if (/\S\s+\S/.test(node.nodeValue)) last = node;
    if (last) last.nodeValue = last.nodeValue.replace(/\s+(\S+\s*)$/, "\u00a0$1");
  }

  function entryHTML(e) {
    var tags = (e.tags || []).filter(Boolean);
    var media = entryGroups(e).map(groupHTML).join("");
    // Text on the left, photos and videos on the right (stacked on narrow screens).
    return '<article id="' + esc(entryId(e)) + '" class="' + (media ? "has-media" : "no-media") + '">' +
      '<div class="text">' +
        '<div class="meta">' + esc(niceDate(e.date)) +
          (tags.length ? " &middot; " + tags.map(esc).join(", ") : "") + "</div>" +
        (e.title ? "<h2>" + esc(e.title) + "</h2>" : "") +
        '<div class="body">' + md(e.body) + "</div>" +
      "</div>" +
      (media ? '<div class="media">' + media + "</div>" : "") +
    "</article>";
  }

  function entryId(e) { return "e-" + String(e.id || e.date || "").replace(/[^\w-]/g, ""); }
  function shortDate(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  }

  /* ---------- sidebar list of entries ---------- */
  function tocHTML(list) {
    return list.map(function (e) {
      return '<a href="#' + esc(entryId(e)) + '"><span>' + esc(shortDate(e.date)) + "</span>" + esc(e.title || "Untitled") + "</a>";
    }).join("");
  }

  // Highlight the entry you're currently reading in the sidebar.
  var spy;
  function watchEntries() {
    if (spy) spy.disconnect();
    if (!("IntersectionObserver" in window)) return;
    spy = new IntersectionObserver(function (items) {
      items.forEach(function (it) {
        if (!it.isIntersecting) return;
        toc.querySelectorAll("a").forEach(function (a) {
          var on = a.getAttribute("href") === "#" + it.target.id;
          a.classList.toggle("on", on);
          if (on && a.scrollIntoView && toc.scrollHeight > toc.clientHeight) a.scrollIntoView({ block: "nearest" });
        });
      });
    }, { rootMargin: "-30% 0px -65% 0px" });
    feed.querySelectorAll("article").forEach(function (a) { spy.observe(a); });
  }

  // The text stays pinned while its photos scroll past, but only when the text fits on screen.
  function pinText() {
    feed.querySelectorAll("article.has-media .text").forEach(function (t) {
      t.classList.toggle("pin", t.offsetHeight < window.innerHeight - 80);
    });
  }

  function render() {
    var q = search.value.trim().toLowerCase();

    // Tags match regardless of capitals ("Reading" = "reading"),
    // but the button shows the tag the way you typed it.
    var counts = {}, label = {};
    ENTRIES.forEach(function (e) {
      (e.tags || []).forEach(function (t) {
        var key = String(t).trim().toLowerCase();
        if (!key) return;
        counts[key] = (counts[key] || 0) + 1;
        if (!label[key]) label[key] = String(t).trim();
      });
    });
    var names = Object.keys(counts).sort();
    tagsEl.innerHTML = names.length
      ? '<button data-tag="" class="' + (activeTag ? "" : "on") + '">All</button>' +
        names.map(function (t) {
          return '<button data-tag="' + esc(t) + '" class="' + (t === activeTag ? "on" : "") + '">' + esc(label[t]) + "</button>";
        }).join("")
      : "";

    var list = ENTRIES.filter(function (e) {
      if (activeTag && !(e.tags || []).some(function (t) { return String(t).toLowerCase() === activeTag; })) return false;
      if (!q) return true;
      return [e.title, e.body, (e.tags || []).join(" "), e.date].join(" ").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });

    toc.innerHTML = tocHTML(list);

    if (!list.length) {
      feed.innerHTML = '<p class="empty">' + (ENTRIES.length ? "Nothing matches that." : "No entries yet.") + "</p>";
    } else {
      var html = "", last = null;
      list.forEach(function (e) {
        var mo = month(e.date);
        if (SHOW_MONTHS && mo !== last) { html += '<h3 class="month">' + esc(mo) + "</h3>"; last = mo; }
        html += entryHTML(e);
      });
      feed.innerHTML = html;
      // No orphans in browsers that don't support "text-wrap: pretty" yet:
      // glue the last two words of each paragraph together.
      if (!(window.CSS && CSS.supports && CSS.supports("text-wrap", "pretty"))) {
        feed.querySelectorAll(".body p, .body li, .body blockquote").forEach(keepLastWordsTogether);
      }
      // Lay out each photo group, and again as photos finish loading (that's when their shapes are known).
      feed.querySelectorAll(".pics").forEach(function (box) {
        layoutPics(box);
        box.querySelectorAll("img").forEach(function (img) {
          if (!img.complete) img.addEventListener("load", function () { layoutPics(box); });
        });
      });
      feed.querySelectorAll('.grid[data-shape="auto"]').forEach(function (box) {
        shapeGrid(box);
        box.querySelectorAll("img").forEach(function (img) {
          if (!img.complete) img.addEventListener("load", function () { shapeGrid(box); });
        });
      });
      pinText();
      watchEntries();
    }
  }

  search.addEventListener("input", render);
  tagsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    activeTag = b.dataset.tag || null;
    render();
  });

  /* ---------- image zoom ---------- */
  var zoom = $("zoom"), zoomImg = zoom.querySelector("img");
  feed.addEventListener("click", function (ev) {
    var img = ev.target.closest("img");
    if (!img) return;
    zoomImg.src = img.src;
    zoom.hidden = false;
  });
  zoom.addEventListener("click", function () { zoom.hidden = true; zoomImg.src = ""; });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !zoom.hidden) { zoom.hidden = true; zoomImg.src = ""; }
  });

  /* ---------- load entries (always the fresh copy) ---------- */
  function start(list) {
    ENTRIES = Array.isArray(list) ? list.slice() : [];
    render();
  }
  // entries.json is written by admin.html. Older sites used entries.js, so fall back to that.
  fetch("entries.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(start)
    .catch(function () {
      var s = document.createElement("script");
      s.src = "entries.js?v=" + Date.now();
      s.onload = function () { start(readEntriesGlobal()); };
      s.onerror = function () { start([]); };
      document.body.appendChild(s);
    });
})();
</script>
</body>
</html>
