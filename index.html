<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elle's Thesis Journal</title>
<meta name="description" content="Progress log for my thesis project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <!-- Edit your title and subtitle here -->
  <header class="site-head">
    <div>
      <h1>Elle's Thesis Journal</h1>
      <p>Logging my progress on this page.</p>
    </div>
    <div class="finder">
      <input id="search" type="search" placeholder="Search" aria-label="Search entries">
      <div id="tags"></div>
    </div>
  </header>

  <main id="feed"></main>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
// Reads entries.js whether it says "const ENTRIES = [...]" or "window.ENTRIES = [...]".
function readEntriesGlobal() {
  return (typeof ENTRIES !== "undefined") ? ENTRIES : window.ENTRIES;
}

(function () {
  "use strict";

  var ENTRIES = [];
  var $ = function (id) { return document.getElementById(id); };
  var feed = $("feed"), tagsEl = $("tags"), search = $("search");
  var activeTag = null;
  var SHOW_MONTHS = false;   // set to true to bring back the "October 2026" headings

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toDate(iso) {
    var s = String(iso || "");
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s += "T00:00:00";
    var d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function niceDate(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { weekday: "short", month: "long", day: "numeric", year: "numeric" }) : (iso || "Undated");
  }
  function month(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "Undated";
  }

  /* ---------- small markdown ---------- */
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split("\n");
    var out = [], para = [], list = null, code = null, m;
    function endPara() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    function endList() { if (list) { out.push("</" + list + ">"); list = null; } }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (code) {
        if (line.indexOf("```") === 0) { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; }
        else code.push(raw);
        return;
      }
      if (line.indexOf("```") === 0) { endPara(); endList(); code = []; return; }
      if (!line) { endPara(); endList(); return; }
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { endPara(); endList(); var h = Math.min(m[1].length + 2, 6); out.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">"); return; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { endPara(); endList(); out.push("<hr>"); return; }
      if ((m = line.match(/^[-*+]\s+(.*)$/)) || (m = line.match(/^\d+[.)]\s+(.*)$/))) {
        var type = /^\d/.test(line) ? "ol" : "ul";
        endPara();
        if (list !== type) { endList(); out.push("<" + type + ">"); list = type; }
        out.push("<li>" + inline(m[1]) + "</li>");
        return;
      }
      if ((m = line.match(/^&gt;\s?(.*)$/))) { endPara(); endList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); return; }
      para.push(line);
    });
    if (code) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
    endPara(); endList();
    return out.join("\n");
  }

  /* ---------- feed ---------- */
  // Photos keep their own shape: one photo is shown full width, several sit in two columns.
  // Videos always get the full width, after the photos.
  function mediaHTML(items) {
    var isVid = function (im) { return /\.(mp4|m4v|mov|webm|ogv)$/i.test(im.src); };
    var cap = function (im) { return im.caption ? "<figcaption>" + esc(im.caption) + "</figcaption>" : ""; };
    var photos = items.filter(function (im) { return !isVid(im); });
    var videos = items.filter(isVid);
    return (photos.length ? '<div class="pics' + (photos.length === 1 ? " one" : "") + '">' + photos.map(function (im) {
        return '<figure><img src="' + esc(im.src) + '" alt="' + esc(im.caption || "") + '" loading="lazy">' + cap(im) + "</figure>";
      }).join("") + "</div>" : "") +
      (videos.length ? '<div class="vids">' + videos.map(function (im) {
        return '<figure><video src="' + esc(im.src) + '#t=0.1" controls playsinline preload="metadata"></video>' + cap(im) + "</figure>";
      }).join("") + "</div>" : "");
  }

  function entryHTML(e) {
    var pics = (e.images || []).map(function (im) { return typeof im === "string" ? { src: im } : (im || {}); })
      .filter(function (im) { return im.src; });
    var tags = (e.tags || []).filter(Boolean);
    return "<article>" +
      '<div class="meta">' + esc(niceDate(e.date)) +
        (tags.length ? " &middot; " + tags.map(esc).join(", ") : "") + "</div>" +
      (e.title ? "<h2>" + esc(e.title) + "</h2>" : "") +
      '<div class="body">' + md(e.body) + "</div>" +
      mediaHTML(pics) +
    "</article>";
  }

  function render() {
    var q = search.value.trim().toLowerCase();

    // Tags match regardless of capitals ("Reading" = "reading"),
    // but the button shows the tag the way you typed it.
    var counts = {}, label = {};
    ENTRIES.forEach(function (e) {
      (e.tags || []).forEach(function (t) {
        var key = String(t).trim().toLowerCase();
        if (!key) return;
        counts[key] = (counts[key] || 0) + 1;
        if (!label[key]) label[key] = String(t).trim();
      });
    });
    var names = Object.keys(counts).sort();
    tagsEl.innerHTML = names.length
      ? '<button data-tag="" class="' + (activeTag ? "" : "on") + '">All</button>' +
        names.map(function (t) {
          return '<button data-tag="' + esc(t) + '" class="' + (t === activeTag ? "on" : "") + '">' + esc(label[t]) + "</button>";
        }).join("")
      : "";

    var list = ENTRIES.filter(function (e) {
      if (activeTag && !(e.tags || []).some(function (t) { return String(t).toLowerCase() === activeTag; })) return false;
      if (!q) return true;
      return [e.title, e.body, (e.tags || []).join(" "), e.date].join(" ").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });

    if (!list.length) {
      feed.innerHTML = '<p class="empty">' + (ENTRIES.length ? "Nothing matches that." : "No entries yet.") + "</p>";
    } else {
      var html = "", last = null;
      list.forEach(function (e) {
        var mo = month(e.date);
        if (SHOW_MONTHS && mo !== last) { html += '<h3 class="month">' + esc(mo) + "</h3>"; last = mo; }
        html += entryHTML(e);
      });
      feed.innerHTML = html;
      // Tell each photo's frame its shape so rows line up without cropping.
      feed.querySelectorAll(".pics img").forEach(function (img) {
        function setShape() {
          if (img.naturalWidth) img.parentNode.style.setProperty("--r", (img.naturalWidth / img.naturalHeight).toFixed(4));
        }
        if (img.complete) setShape(); else img.addEventListener("load", setShape);
      });
    }
  }

  search.addEventListener("input", render);
  tagsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    activeTag = b.dataset.tag || null;
    render();
  });

  /* ---------- image zoom ---------- */
  var zoom = $("zoom"), zoomImg = zoom.querySelector("img");
  feed.addEventListener("click", function (ev) {
    var img = ev.target.closest("img");
    if (!img) return;
    zoomImg.src = img.src;
    zoom.hidden = false;
  });
  zoom.addEventListener("click", function () { zoom.hidden = true; zoomImg.src = ""; });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !zoom.hidden) { zoom.hidden = true; zoomImg.src = ""; }
  });

  /* ---------- load entries (always the fresh copy) ---------- */
  function start(list) {
    ENTRIES = Array.isArray(list) ? list.slice() : [];
    render();
  }
  // entries.json is written by admin.html. Older sites used entries.js, so fall back to that.
  fetch("entries.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(start)
    .catch(function () {
      var s = document.createElement("script");
      s.src = "entries.js?v=" + Date.now();
      s.onload = function () { start(readEntriesGlobal()); };
      s.onerror = function () { start([]); };
      document.body.appendChild(s);
    });
})();
</script>
</body>
</html>
