<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Journal</title>
<meta name="description" content="Progress log for my thesis project.">
<style>
  :root{
    --paper:#fbfaf7;
    --ink:#222;
    --muted:#7a766f;
    --rule:#dedad2;
    --link:#8a3b12;
    --field:#fff;
    --bad:#a4441f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1a1918;
      --ink:#e6e2da;
      --muted:#948e84;
      --rule:#35322e;
      --link:#e0a27a;
      --field:#222120;
      --bad:#ffb894;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:18px/1.65 Charter,"Iowan Old Style",Georgia,serif;
  }
  .page{max-width:640px;margin:0 auto;padding:3.5rem 1.25rem 4rem}
  a{color:var(--link)}
  small,.meta{font-size:.82rem;color:var(--muted)}

  header h1{font-size:1.9rem;font-weight:normal;margin:0}
  header p{margin:.2rem 0 0;color:var(--muted)}

  .tools{margin:2rem 0 2.5rem;padding-bottom:1rem;border-bottom:1px solid var(--rule)}
  #search{
    width:100%;font:inherit;font-size:1rem;color:inherit;background:transparent;
    border:0;border-bottom:1px solid var(--rule);padding:.3rem 0;margin-bottom:.6rem;
  }
  #search:focus{outline:none;border-bottom-color:var(--ink)}
  #tags{font-size:.88rem;color:var(--muted)}
  #tags button{font:inherit;background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
  #tags button:hover{color:var(--ink)}
  #tags button.on{color:var(--ink);text-decoration:underline}

  .month{font-size:.95rem;font-style:italic;font-weight:normal;color:var(--muted);margin:3rem 0 1rem}
  .month:first-child{margin-top:0}
  article{margin-bottom:2.5rem}
  article h2{font-size:1.3rem;font-weight:normal;margin:.1rem 0 .5rem;line-height:1.3}
  .body p{margin:0 0 1rem}
  .body h3,.body h4,.body h5{font-size:1.05rem;margin:1.4rem 0 .4rem}
  .body ul,.body ol{padding-left:1.3rem;margin:0 0 1rem}
  .body blockquote{margin:0 0 1rem;padding-left:1rem;border-left:2px solid var(--rule);color:var(--muted)}
  .body hr{border:0;border-top:1px solid var(--rule);margin:1.5rem 0}
  .body code{font:.85em ui-monospace,Menlo,Consolas,monospace}
  .body pre{font-size:.85rem;overflow:auto;padding:.8rem;border:1px solid var(--rule);margin:0 0 1rem}
  .body img,.pics img{max-width:100%;display:block;cursor:zoom-in}
  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem;margin-top:.8rem}
  .pics figure{margin:0}
  .pics img{width:100%;aspect-ratio:4/3;object-fit:cover}
  .pics figcaption{font-size:.8rem;color:var(--muted)}
  .empty{color:var(--muted);font-style:italic}

  footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}

  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:1.5rem;cursor:zoom-out;z-index:9}
  #zoom img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div class="page">

  <!-- Edit your title and subtitle here -->
  <header>
    <h1>Thesis Journal</h1>
    <p>Reading, experiments, dead ends and small wins.</p>
  </header>

  <div class="tools">
    <input id="search" type="search" placeholder="Search" aria-label="Search entries">
    <div id="tags"></div>
  </div>

  <main id="feed"></main>

  <footer>
    <span id="count"></span>
    <span>Thesis journal</span>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
// Reads entries.js whether it says "const ENTRIES = [...]" or "window.ENTRIES = [...]".
function readEntriesGlobal() {
  return (typeof ENTRIES !== "undefined") ? ENTRIES : window.ENTRIES;
}

(function () {
  "use strict";

  var ENTRIES = [];
  var $ = function (id) { return document.getElementById(id); };
  var feed = $("feed"), tagsEl = $("tags"), search = $("search"), count = $("count");
  var activeTag = null;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toDate(iso) {
    var s = String(iso || "");
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s += "T00:00:00";
    var d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function niceDate(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { weekday: "short", month: "long", day: "numeric", year: "numeric" }) : (iso || "Undated");
  }
  function month(iso) {
    var d = toDate(iso);
    return d ? d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "Undated";
  }

  /* ---------- small markdown ---------- */
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split("\n");
    var out = [], para = [], list = null, code = null, m;
    function endPara() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    function endList() { if (list) { out.push("</" + list + ">"); list = null; } }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (code) {
        if (line.indexOf("```") === 0) { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; }
        else code.push(raw);
        return;
      }
      if (line.indexOf("```") === 0) { endPara(); endList(); code = []; return; }
      if (!line) { endPara(); endList(); return; }
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { endPara(); endList(); var h = Math.min(m[1].length + 2, 6); out.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">"); return; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { endPara(); endList(); out.push("<hr>"); return; }
      if ((m = line.match(/^[-*+]\s+(.*)$/)) || (m = line.match(/^\d+[.)]\s+(.*)$/))) {
        var type = /^\d/.test(line) ? "ol" : "ul";
        endPara();
        if (list !== type) { endList(); out.push("<" + type + ">"); list = type; }
        out.push("<li>" + inline(m[1]) + "</li>");
        return;
      }
      if ((m = line.match(/^&gt;\s?(.*)$/))) { endPara(); endList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); return; }
      para.push(line);
    });
    if (code) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
    endPara(); endList();
    return out.join("\n");
  }

  /* ---------- feed ---------- */
  function entryHTML(e) {
    var pics = (e.images || []).map(function (im) { return typeof im === "string" ? { src: im } : (im || {}); })
      .filter(function (im) { return im.src; });
    var tags = (e.tags || []).filter(Boolean);
    return "<article>" +
      '<div class="meta">' + esc(niceDate(e.date)) +
        (tags.length ? " &middot; " + tags.map(esc).join(", ") : "") + "</div>" +
      (e.title ? "<h2>" + esc(e.title) + "</h2>" : "") +
      '<div class="body">' + md(e.body) + "</div>" +
      (pics.length ? '<div class="pics">' + pics.map(function (im) {
        return '<figure><img src="' + esc(im.src) + '" alt="' + esc(im.caption || "") + '" loading="lazy">' +
          (im.caption ? "<figcaption>" + esc(im.caption) + "</figcaption>" : "") + "</figure>";
      }).join("") + "</div>" : "") +
    "</article>";
  }

  function render() {
    var q = search.value.trim().toLowerCase();

    var counts = {};
    ENTRIES.forEach(function (e) {
      (e.tags || []).forEach(function (t) { t = String(t).toLowerCase(); counts[t] = (counts[t] || 0) + 1; });
    });
    var names = Object.keys(counts).sort();
    tagsEl.innerHTML = names.length
      ? '<button data-tag="" class="' + (activeTag ? "" : "on") + '">all</button>' +
        names.map(function (t) {
          return ' &middot; <button data-tag="' + esc(t) + '" class="' + (t === activeTag ? "on" : "") + '">' + esc(t) + "</button>";
        }).join("")
      : "";

    var list = ENTRIES.filter(function (e) {
      if (activeTag && !(e.tags || []).some(function (t) { return String(t).toLowerCase() === activeTag; })) return false;
      if (!q) return true;
      return [e.title, e.body, (e.tags || []).join(" "), e.date].join(" ").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });

    if (!list.length) {
      feed.innerHTML = '<p class="empty">' + (ENTRIES.length ? "Nothing matches that." : "No entries yet.") + "</p>";
    } else {
      var html = "", last = null;
      list.forEach(function (e) {
        var mo = month(e.date);
        if (mo !== last) { html += '<h3 class="month">' + esc(mo) + "</h3>"; last = mo; }
        html += entryHTML(e);
      });
      feed.innerHTML = html;
    }
    count.textContent = ENTRIES.length + (ENTRIES.length === 1 ? " entry" : " entries");
  }

  search.addEventListener("input", render);
  tagsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    activeTag = b.dataset.tag || null;
    render();
  });

  /* ---------- image zoom ---------- */
  var zoom = $("zoom"), zoomImg = zoom.querySelector("img");
  feed.addEventListener("click", function (ev) {
    var img = ev.target.closest("img");
    if (!img) return;
    zoomImg.src = img.src;
    zoom.hidden = false;
  });
  zoom.addEventListener("click", function () { zoom.hidden = true; zoomImg.src = ""; });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !zoom.hidden) { zoom.hidden = true; zoomImg.src = ""; }
  });

  /* ---------- load entries (always the fresh copy) ---------- */
  function start(list) {
    ENTRIES = Array.isArray(list) ? list.slice() : [];
    render();
  }
  // entries.json is written by admin.html. Older sites used entries.js, so fall back to that.
  fetch("entries.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(start)
    .catch(function () {
      var s = document.createElement("script");
      s.src = "entries.js?v=" + Date.now();
      s.onload = function () { start(readEntriesGlobal()); };
      s.onerror = function () { start([]); };
      document.body.appendChild(s);
    });
})();
</script>
</body>
</html>
